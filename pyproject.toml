[project]
name = "sourcebound-research"
version = "0.1.0"
description = "Evidence-first meeting briefing agent for the Geek Room Global AI Hackathon"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=1.0",
  "openai>=1.60",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "tavily-python>=0.5",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
