<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Briefcast — evidence-first pre-meeting intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1523"/>
      <stop offset="55%" stop-color="#09111d"/>
      <stop offset="100%" stop-color="#0c1726"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55c3e7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#55c3e7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#55c3e7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a995ed" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#a995ed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a995ed" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="58%" stop-color="#dceef7"/>
      <stop offset="100%" stop-color="#55c3e7"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55c3e7" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#a995ed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a995ed" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ea2b6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <pattern id="gridCoarse" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#8ea2b6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#gridCoarse)"/>
  <ellipse cx="150" cy="60" rx="380" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1050" cy="280" rx="400" ry="240" fill="url(#glowPurple)"/>

  <!-- top hairline -->
  <rect x="0" y="0" width="1200" height="1" fill="#55c3e7" fill-opacity="0.35"/>

  <!-- brand mark -->
  <g transform="translate(64,86)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="none" stroke="#55c3e7" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="12" y="12" width="10" height="10" rx="2.5" fill="#55c3e7"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="64" y="180" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.6" fill="url(#wordmark)">Briefcast</text>
  <text x="66" y="216" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#b4c3d2">Evidence-first pre-meeting intelligence.</text>
  <rect x="64" y="234" width="420" height="1.5" fill="url(#rule)"/>

  <!-- stack pills -->
  <g font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#b4c3d2">
    <g>
      <rect x="64" y="252" width="86" height="30" rx="15" fill="#121e2d" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="107" y="271" text-anchor="middle">Vue 3</text>
    </g>
    <g>
      <rect x="160" y="252" width="90" height="30" rx="15" fill="#121e2d" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="205" y="271" text-anchor="middle">FastAPI</text>
    </g>
    <g>
      <rect x="260" y="252" width="106" height="30" rx="15" fill="#121e2d" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="313" y="271" text-anchor="middle">LangGraph</text>
    </g>
    <g>
      <rect x="376" y="252" width="84" height="30" rx="15" fill="#121e2d" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="418" y="271" text-anchor="middle">Tavily</text>
    </g>
  </g>

  <!-- scope card -->
  <g font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <rect x="744" y="64" width="392" height="188" rx="16" fill="#121e2d" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="744" y="64" width="392" height="188" rx="16" fill="none" stroke="#55c3e7" stroke-opacity="0.18"/>
    <rect x="744" y="64" width="392" height="34" rx="16" fill="#1a2a3b" fill-opacity="0.85"/>
    <rect x="744" y="88" width="392" height="10" fill="#1a2a3b" fill-opacity="0.85"/>

    <text x="772" y="86" font-size="11" letter-spacing="2.4" fill="#8ea2b6">SCOPE</text>
    <circle cx="1104" cy="81" r="3.5" fill="#10b981"/>

    <g font-size="14">
      <text x="772" y="132" font-weight="600" fill="#f5f8fb">30 days</text>
      <text x="854" y="132" fill="#8ea2b6">window before the meeting</text>

      <text x="772" y="170" font-weight="600" fill="#f5f8fb">3 answers</text>
      <text x="866" y="170" fill="#8ea2b6">happened · means · to ask</text>

      <text x="772" y="208" font-weight="600" fill="#f5f8fb">1 quote per claim</text>
      <text x="772" y="228" font-size="12.5" fill="#8ea2b6">matched against the retrieved article text</text>
    </g>

    <rect x="772" y="118" width="336" height="1" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="772" y="156" width="336" height="1" fill="#ffffff" fill-opacity="0.06"/>
  </g>

  <!-- footer note -->
  <text x="64" y="302" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8ea2b6">Global AI Hackathon · Problem Statement 05 — Build a Pre-Meeting Briefing Agent (Tavily)</text>
  <text x="1136" y="302" text-anchor="end" font-family="Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8ea2b6">MIT</text>
</svg>
