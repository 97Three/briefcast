<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Briefcast — evidence-first pre-meeting intelligence">
  <defs>
    <pattern id="lines" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1d2433" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="card" x1="820" y1="80" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbf7f0" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#f7f3ea"/>
  <rect width="1200" height="320" fill="url(#lines)"/>
  <circle cx="1120" cy="20" r="150" fill="#b23a48" fill-opacity="0.07"/>
  <circle cx="80" cy="320" r="160" fill="#3f7f7a" fill-opacity="0.07"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10" letter-spacing="3" fill="#b23a48">
    <text x="80" y="62">BRIEFCAST</text>
    <text x="1120" y="62" text-anchor="end" letter-spacing="2.2" fill="#8b7f72">EVIDENCE-FIRST</text>
  </g>

  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#1d2433">Briefcast</text>
  <rect x="82" y="176" width="96" height="3" fill="#b23a48"/>
  <text x="80" y="212" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#5b5148">Evidence-first pre-meeting intelligence.</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="10" letter-spacing="1.2">
    <rect x="80" y="236" width="76" height="28" rx="14" fill="#fffdf8" stroke="#d8cbb8"/>
    <text x="118" y="254" fill="#5b5148" text-anchor="middle">VUE 3</text>
    <rect x="164" y="236" width="88" height="28" rx="14" fill="#fffdf8" stroke="#d8cbb8"/>
    <text x="208" y="254" fill="#5b5148" text-anchor="middle">FASTAPI</text>
    <rect x="260" y="236" width="100" height="28" rx="14" fill="#fffdf8" stroke="#d8cbb8"/>
    <text x="310" y="254" fill="#5b5148" text-anchor="middle">LANGGRAPH</text>
    <rect x="368" y="236" width="80" height="28" rx="14" fill="#fffdf8" stroke="#d8cbb8"/>
    <text x="408" y="254" fill="#5b5148" text-anchor="middle">TAVILY</text>
  </g>

  <text x="80" y="290" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" letter-spacing="0.8" fill="#8b7f72">Global AI Hackathon · Problem Statement 05 · Pre-Meeting Briefing Agent</text>

  <rect x="820" y="80" width="300" height="168" rx="14" fill="url(#card)" stroke="#d8cbb8"/>
  <g font-family="'JetBrains Mono', Consolas, monospace">
    <text x="844" y="108" font-size="9" letter-spacing="2.2" fill="#8b7f72">ONE BRIEF</text>
    <text x="1096" y="108" font-size="9" letter-spacing="1.6" fill="#3f7f7a" text-anchor="end">30-DAY WINDOW</text>
    <path d="M844 122H1096" stroke="#e6dbcb"/>

    <text x="844" y="154" font-family="Georgia, serif" font-size="26" fill="#b23a48">30</text>
    <text x="884" y="152" font-family="Inter, sans-serif" font-size="12" fill="#1d2433">days of recent signals</text>

    <text x="844" y="190" font-family="Georgia, serif" font-size="26" fill="#b23a48">3</text>
    <text x="884" y="188" font-family="Inter, sans-serif" font-size="12" fill="#1d2433">answers, one page</text>

    <text x="844" y="226" font-family="Georgia, serif" font-size="26" fill="#b23a48">1</text>
    <text x="884" y="224" font-family="Inter, sans-serif" font-size="12" fill="#1d2433">quote behind every claim</text>
  </g>

  <path d="M0 0H1200" stroke="#1d2433" stroke-opacity="0.08"/>
  <path d="M0 319H1200" stroke="#1d2433" stroke-opacity="0.08"/>
